name: wetruck_core
description: "Shared Dart package for Wetruck Flutter apps (theme, api, auth, i18n, widgets)"
version: 0.0.1
homepage:

environment:
  sdk: ^3.11.5
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

  # State management — chosen as the closest analog to react-query.
  flutter_riverpod: ^2.6.1

  # HTTP client + interceptors. Replaces fetch() in src/lib/api-client.ts.
  dio: ^5.7.0
  dio_cookie_manager: ^3.2.0
  cookie_jar: ^4.0.8

  # Token storage — encrypted by the OS keystore.
  # Upgrade over localStorage used by the Next/Capacitor build.
  flutter_secure_storage: ^9.2.4

  # Declarative routing — mirrors the (auth)/(dashboard) route groups.
  go_router: ^14.6.2

  # i18n — homegrown JSON loader (see src/i18n/wetruck_i18n.dart).
  # easy_localization was removed after repeatedly failing to load the
  # asset bundles silently.
  intl: ^0.20.2
  shared_preferences: ^2.5.0

  # Fonts. Ge'ez script (Amharic, Tigrinya) isn't covered by Roboto, so we
  # use Noto Sans Ethiopic via google_fonts as a fontFamilyFallback.
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

